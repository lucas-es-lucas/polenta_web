		<link

	<body>

			class="go-to-tickets go-to-tickets__index"
			href="/index.html#tickets"
			onclick="cerrar()"

				class="go-to-tickets__icon"

			/><span class="go-to-tickets__text">COMPRAR TICKETS</span></a
		>

	<script src="/index.js"></script>
	<script>

			$(".navbar-collapse").removeClass("show");
		}
